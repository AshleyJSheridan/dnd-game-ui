<div class="ability">
    <div class="ability-name">
        <span class="ability-short-name">{{ abilityShortName() }}</span>
        <span class="ability-long-name">{{ abilityName() }}</span>
    </div>
    <div class="ability-score">{{ abilityBase() }}</div>
    <div class="ability-modifier">{{ abilityModifier() }}</div>
</div>
